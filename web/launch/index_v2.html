<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>UPI Feature Workspace</title><link rel="stylesheet" href="/style.css"><script src="/app.js" defer></script></head>
<body><a class="skip" href="#content">Skip to content</a>
<aside class="sidebar"><a href="/" class="brand"><span class="brand-name">UPI</span><span>Feature <br>Workspace</span></a><button class="all-workspaces" data-home>All workspaces</button><nav id="navigation" aria-label="Workspace navigation"></nav><div class="sidebar-bottom"><button data-help>Help & how it works</button><a href="http://127.0.0.1:8765" target="_blank" rel="noopener">Circular research app ↗</a><span>Local workspace · V2</span></div></aside>
<main><header class="topbar"><div id="breadcrumbs">Workspaces</div><div class="header-actions"><button id="model-status" data-help class="connection">Checking local AI</button><button id="account-button" data-account>Workspace owner</button></div></header>
<div id="toast" role="status" hidden></div><div id="updates" class="notice" hidden><span>Updated work is ready. Your unsaved changes are still here.</span><button data-refresh>View latest version</button></div><section id="content" tabindex="-1"></section></main>
<dialog id="modal" aria-labelledby="modal-title"><div class="dialog-head"><h2 id="modal-title"></h2><button class="close-button" type="button" data-close aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
<dialog id="confirm" aria-labelledby="confirm-title"><div class="dialog-head"><h2 id="confirm-title"></h2><button class="close-button" type="button" data-cancel aria-label="Cancel">×</button></div><p id="confirm-copy"></p><div class="dialog-actions"><button data-cancel>Cancel</button><button id="confirm-button" class="primary">Continue</button></div></dialog>
</body></html>
